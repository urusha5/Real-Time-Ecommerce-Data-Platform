name: Production checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-password
          POSTGRES_DB: commerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d commerce_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Locate project
        id: project
        run: |
          if [ -f dashboard/server.mjs ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          else
            echo "path=Ecommerce_Realtime_Data_Pipeline-main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.path }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ steps.project.outputs.path }}
      - run: npm run check
        working-directory: ${{ steps.project.outputs.path }}
      - name: Unit, security and PostgreSQL integration tests
        run: npm test
        working-directory: ${{ steps.project.outputs.path }}
        env:
          TEST_DATABASE_URL: postgres://postgres:ephemeral-ci-password@localhost:5432/commerce_test
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ steps.project.outputs.path }}
      - name: Validate production Compose
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          printf '%s\n' 'temporary-ci-only-password' | node dashboard/scripts/setup-secrets.mjs
          DOMAIN=commerce.example.com ADMIN_USERNAME=ci docker compose -f compose.production.yml config --quiet
      - name: Build production container
        run: docker build --tag commerce-platform:ci .
        working-directory: ${{ steps.project.outputs.path }}
      - name: Smoke-test production app, migrations and non-root secret mounts
        working-directory: ${{ steps.project.outputs.path }}
        env:
          DOMAIN: commerce.example.com
          ADMIN_USERNAME: ci
        run: |
          docker compose -f compose.production.yml up -d --build --wait --wait-timeout 120 app
          docker compose -f compose.production.yml exec -T app node -e "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1))"
          docker compose -f compose.production.yml exec -T app node -e "fetch('http://127.0.0.1:3000/api/dashboard').then(r=>process.exit(r.status===401?0:1))"
      - name: Clean up disposable CI services
        if: always()
        working-directory: ${{ steps.project.outputs.path }}
        env:
          DOMAIN: commerce.example.com
          ADMIN_USERNAME: ci
        run: docker compose -f compose.production.yml down -v --remove-orphans
